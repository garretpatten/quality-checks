---
name: Accessibility Checks

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      diff_base:
        description: >
          Git ref to diff against (SHA or branch), e.g.
          github.event.pull_request.base.sha. When empty, the default
          branch of origin is auto-detected (any name).
        required: false
        default: ''
        type: string
      urls:
        description: >
          URLs to audit (one per line). Required for Lighthouse. Also used
          by axe for deployed previews or production pages.
        required: false
        default: ''
        type: string
      local_html_paths:
        description: >
          Newline-separated repo-relative HTML paths to audit via a local
          static server (merged with changed `.html` files in the PR diff).
        required: false
        default: ''
        type: string
      lighthouse_min_accessibility:
        description: >
          Minimum Lighthouse accessibility category score (0.0–1.0).
        required: false
        default: '0.9'
        type: string
      lighthouse_temporary_public_storage:
        description: >
          Upload the Lighthouse report to publicly readable temporary
          storage. Off by default: reports of private pages must not become
          public. The report is still saved as a private run artifact via
          uploadArtifacts. Opt in only for audited pages that are public.
        required: false
        default: false
        type: boolean

env:
  QC_DIFF_BASE: ${{ inputs.diff_base }}
  # Internal detail; the ephemeral static server uses a fixed high port.
  QC_STATIC_PORT: '8765'

jobs:
  detect:
    name: 'Detect Audit Targets'
    runs-on: ubuntu-latest
    env:
      QC_URLS: ${{ inputs.urls }}
      QC_LOCAL_HTML_PATHS: ${{ inputs.local_html_paths }}

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 'Collect audit targets'
        id: targets
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # shellcheck source=.github/scripts/qc-resolve-base.sh
          source .github/scripts/qc-resolve-base.sh

          mapfile -t remote_urls < <(
            printf '%s\n' "${QC_URLS}" |
              sed '/^[[:space:]]*$/d' || true
          )

          mapfile -t extra_html < <(
            printf '%s\n' "${QC_LOCAL_HTML_PATHS}" |
              sed '/^[[:space:]]*$/d' || true
          )

          mapfile -t changed_html < <(
            git diff --name-only --diff-filter=ACMR "${BASE_REF}"...HEAD |
              grep -E '\.html?$' |
              .github/scripts/qc-filter-changed-paths.sh || true
          )

          html_paths=()
          for path in "${extra_html[@]}" "${changed_html[@]}"; do
            [[ -z "${path}" ]] && continue
            [[ -f "${path}" ]] || continue
            html_paths+=( "${path}" )
          done

          # shellcheck source=.github/scripts/qc-write-multiline-output.sh
          source .github/scripts/qc-write-multiline-output.sh
          qc_write_multiline_output remote_urls "${remote_urls[@]}"
          qc_write_multiline_output html_paths "${html_paths[@]}"
          {
            printf 'remote_count=%s\n' "${#remote_urls[@]}"
            printf 'html_count=%s\n' "${#html_paths[@]}"
          } >> "$GITHUB_OUTPUT"

    outputs:
      remote_urls: ${{ steps.targets.outputs.remote_urls }}
      remote_count: ${{ steps.targets.outputs.remote_count }}
      html_paths: ${{ steps.targets.outputs.html_paths }}
      html_count: ${{ steps.targets.outputs.html_count }}

  axe:
    name: 'axe-core - Accessibility Audit'
    needs: detect
    # yamllint disable-line rule:line-length
    if: needs.detect.outputs.remote_count != '0' || needs.detect.outputs.html_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Setup Node.js'
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: 'Install axe-core and sync ChromeDriver'
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/qc-axe-setup.sh
          source .github/scripts/qc-axe-setup.sh

      - name: 'Run axe on remote URLs'
        if: needs.detect.outputs.remote_count != '0'
        env:
          QC_REMOTE_URLS: ${{ needs.detect.outputs.remote_urls }}
        run: |
          set -euo pipefail
          readarray -t remote_urls < <(printf '%s\n' "${QC_REMOTE_URLS}")
          for url in "${remote_urls[@]}"; do
            [[ -z "${url}" ]] && continue
            echo "Auditing ${url}"
            axe --chromedriver-path "${CHROMEDRIVER_PATH}" "${url}" --exit
          done

      - name: 'Run axe on local HTML'
        if: needs.detect.outputs.html_count != '0'
        env:
          QC_HTML_PATHS: ${{ needs.detect.outputs.html_paths }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          readarray -t html_paths < <(printf '%s\n' "${QC_HTML_PATHS}")
          if [[ ${#html_paths[@]} -eq 0 ]] || [[ -z "${html_paths[0]}" ]]; then
            exit 0
          fi
          npx --yes "serve@${QC_SERVE_VERSION}" \
            -l "${QC_STATIC_PORT}" --no-clipboard . &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          # Poll until the local server answers instead of sleeping a
          # fixed time; a connection refused is retried (issue #37 L3).
          # A 404 for the root path is fine - only connectivity matters.
          root_url="http://127.0.0.1:${QC_STATIC_PORT}/"
          if ! curl --noproxy '*' --retry 30 --retry-delay 1 \
            --retry-connrefused -s -o /dev/null "${root_url}"; then
            echo 'Local static server did not become ready' >&2
            exit 1
          fi
          for path in "${html_paths[@]}"; do
            [[ -z "${path}" ]] && continue
            url="http://127.0.0.1:${QC_STATIC_PORT}/${path}"
            echo "Auditing ${url}"
            axe --chromedriver-path "${CHROMEDRIVER_PATH}" "${url}" --exit
          done

  lighthouse:
    name: 'Lighthouse - Accessibility Audit'
    needs: detect
    if: ${{ inputs.urls != '' }}
    runs-on: ubuntu-latest
    env:
      QC_URLS: ${{ inputs.urls }}
      QC_LHCI_MIN_SCORE: ${{ inputs.lighthouse_min_accessibility }}

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 'Validate URLs'
        id: urls
        run: |
          set -euo pipefail
          mapfile -t urls < <(
            printf '%s\n' "${QC_URLS}" |
              sed '/^[[:space:]]*$/d' || true
          )
          if [[ ${#urls[@]} -eq 0 ]] || [[ -z "${urls[0]}" ]]; then
            echo "Lighthouse requires at least one URL in urls."
            exit 1
          fi
          # shellcheck source=.github/scripts/qc-write-multiline-output.sh
          source .github/scripts/qc-write-multiline-output.sh
          qc_write_multiline_output list "${urls[@]}"

      - name: 'Write Lighthouse CI config'
        run: |
          set -euo pipefail
          if [[ -f lighthouserc.json ]] || [[ -f lighthouserc.js ]]; then
            echo 'Using repository Lighthouse CI config'
            exit 0
          fi
          min_score="${QC_LHCI_MIN_SCORE//[[:space:]]/}"
          if ! [[ "${min_score}" =~ ^[0-9]+(\.[0-9]+)?$ ]] ||
            ! awk -v n="${min_score}" 'BEGIN { exit (n < 0 || n > 1) }'; then
            echo "lighthouse_min_accessibility must be a number" \
              "between 0 and 1; got '${QC_LHCI_MIN_SCORE}'" >&2
            exit 1
          fi
          jq -n --argjson min "${min_score}" \
            '{
              ci: {
                collect: {
                  numberOfRuns: 1,
                  settings: {onlyCategories: ["accessibility"]}
                },
                assert: {
                  assertions: {
                    "categories:accessibility": ["error", {minScore: $min}]
                  }
                }
              }
            }' > lighthouserc.json

      - name: 'Run Lighthouse CI'
        # yamllint disable rule:line-length
        # treosh/lighthouse-ci-action 12.6.2
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        # yamllint enable rule:line-length
        with:
          urls: |
            ${{ steps.urls.outputs.list }}
          uploadArtifacts: true
          # yamllint disable-line rule:line-length
          temporaryPublicStorage: ${{ inputs.lighthouse_temporary_public_storage }}

  summary:
    name: checks
    needs:
      - detect
      - axe
      - lighthouse
    # Required-check pattern for skipped-but-required jobs: the aggregate
    # reports success when every applicable audit job passed and every
    # skipped job was intentionally skipped.
    # yamllint disable-line rule:line-length
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest

    steps:
      - name: 'All applicable accessibility checks passed'
        run: |
          echo 'All applicable accessibility checks passed.'
