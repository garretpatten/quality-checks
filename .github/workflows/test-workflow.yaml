name: 'Test Workflow'

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    name: 'Unit Tests (bats)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup bats
        id: setup-bats
        # bats-core/bats-action 4.1.0
        # yamllint disable-line rule:line-length
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e
        with:
          bats-version: '1.14.0'
          detik-install: false
          github-token: ${{ github.token }}

      - name: ShellCheck tests
        # The shared quality gate only lints changed shell files, so
        # lint the whole suite here (*.bats, helpers, fixtures, stubs).
        run: |
          find tests -type f \( -name '*.bats' -o -name '*.bash' \
            -o -name '*.sh' -o -path 'tests/stubs/*' \) -print0 |
            xargs -0 shellcheck -x

      - name: Run bats
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: bats --recursive tests/

  linters:
    name: 'Linters'
    uses: ./.github/workflows/quality-checks.yaml
    with:
      diff_base: ${{ github.event.pull_request.base.sha || '' }}
      editorconfig_run: true
      eslint_run: true
      golangci_lint_run: false
      hadolint_run: true
      jq_run: true
      markdownlint_run: true
      prettier_run: true
      ruff_run: true
      shellcheck_run: true
      shfmt_run: true
      taplo_run: true
      typos_run: true
      yamllint_run: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  accessibility:
    name: 'Accessibility Audits'
    uses: ./.github/workflows/accessibility-checks.yaml
    with:
      diff_base: ${{ github.event.pull_request.base.sha || '' }}
      axe_run: true
      lighthouse_run: false
      local_html_paths: docs/fixtures/a11y-sample.html
