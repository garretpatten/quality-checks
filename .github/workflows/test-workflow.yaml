name: 'Test Workflow'

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  linters:
    name: 'Linters'
    uses: ./.github/workflows/quality-checks.yaml
    with:
      diff_base: ${{ github.event.pull_request.base.sha || '' }}
      actionlint_run: true
      editorconfig_run: true
      eslint_run: true
      golangci_lint_run: false
      hadolint_run: true
      jq_run: true
      markdownlint_run: true
      prettier_run: true
      ruff_run: true
      shellcheck_run: true
      shfmt_run: true
      taplo_run: true
      typos_run: true
      yamllint_run: true
    secrets: inherit

  accessibility:
    name: 'Accessibility Audits'
    uses: ./.github/workflows/accessibility-checks.yaml
    with:
      diff_base: ${{ github.event.pull_request.base.sha || '' }}
      axe_run: true
      lighthouse_run: false
      local_html_paths: docs/fixtures/a11y-sample.html
    secrets: inherit
