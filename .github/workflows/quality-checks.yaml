---
name: Quality Checks

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      diff_base:
        description: >
          Git ref to diff against (SHA or branch), e.g.
          github.event.pull_request.base.sha. When empty, the default
          branch of origin is auto-detected (any name); tools run on the
          pull-request diff only.
        required: false
        default: ''
        type: string

env:
  QC_DIFF_BASE: ${{ inputs.diff_base }}
  # Pinned tool versions, in one place. Dependabot does not manage
  # run:-step installs, so bumps are made deliberately via PRs
  # (dependency-hygiene standard: never use `latest`).
  QC_ESLINT_VERSION: '10.15.0'
  QC_MARKDOWNLINT_VERSION: '0.24.1'
  QC_PRETTIER_VERSION: '3.10.1'
  QC_RUFF_VERSION: '0.17.6'
  QC_YAMLLINT_VERSION: '1.38.0'
  QC_HADOLINT_VERSION: 'v2.15.1'
  QC_TAPLO_VERSION: '0.10.0'
  QC_SHFMT_VERSION: '3.10.0'
  QC_EC_VERSION: 'v3.7.0'
  QC_TYPOS_VERSION: 'v1.47.0'
  QC_GOLANGCI_LINT_VERSION: '2.1.6'
  QC_ACTIONLINT_VERSION: 'v1.7.12'
  QC_STYLUA_VERSION: 'v2.4.1'
  QC_SERVE_VERSION: '14.2.6'

jobs:
  detect:
    name: 'Detect Changed Files'
    runs-on: ubuntu-latest
    env:
      QC_SCRIPTS: ${{ github.workspace }}/.qc-tooling/.github/scripts

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Helpers live in this repository, not in the caller checkout.
      - name: 'Checkout quality-checks tooling'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qc-tooling
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: 'Classify changed files'
        id: classify
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # shellcheck source=.github/scripts/qc-resolve-base.sh
          source "${QC_SCRIPTS}/qc-resolve-base.sh"
          mapfile -t CHANGED < <(
            git diff --name-only --diff-filter=ACMR "${BASE_REF}"...HEAD |
              "${QC_SCRIPTS}/qc-filter-changed-paths.sh" || true
          )
          # shellcheck source=.github/scripts/qc-classify-changed.sh
          source "${QC_SCRIPTS}/qc-classify-changed.sh"
          # Fragments (<list>_count and heredoc <list>_files blocks) are
          # never interpolated into this script; they flow through
          # GITHUB_OUTPUT into job env (issue #37 C1/S1).
          qc_classify_changed "${CHANGED[@]}" >> "$GITHUB_OUTPUT"

    outputs:
      eslint_count: ${{ steps.classify.outputs.eslint_count }}
      eslint_files: ${{ steps.classify.outputs.eslint_files }}
      prettier_count: ${{ steps.classify.outputs.prettier_count }}
      prettier_files: ${{ steps.classify.outputs.prettier_files }}
      markdownlint_count: ${{ steps.classify.outputs.markdownlint_count }}
      markdownlint_files: ${{ steps.classify.outputs.markdownlint_files }}
      yaml_count: ${{ steps.classify.outputs.yaml_count }}
      yaml_files: ${{ steps.classify.outputs.yaml_files }}
      shell_count: ${{ steps.classify.outputs.shell_count }}
      shell_files: ${{ steps.classify.outputs.shell_files }}
      ruff_count: ${{ steps.classify.outputs.ruff_count }}
      ruff_files: ${{ steps.classify.outputs.ruff_files }}
      toml_count: ${{ steps.classify.outputs.toml_count }}
      toml_files: ${{ steps.classify.outputs.toml_files }}
      docker_count: ${{ steps.classify.outputs.docker_count }}
      docker_files: ${{ steps.classify.outputs.docker_files }}
      go_count: ${{ steps.classify.outputs.go_count }}
      go_files: ${{ steps.classify.outputs.go_files }}
      actionlint_count: ${{ steps.classify.outputs.actionlint_count }}
      actionlint_files: ${{ steps.classify.outputs.actionlint_files }}
      stylua_count: ${{ steps.classify.outputs.stylua_count }}
      stylua_files: ${{ steps.classify.outputs.stylua_files }}
      jq_count: ${{ steps.classify.outputs.jq_count }}
      jq_files: ${{ steps.classify.outputs.jq_files }}
      prose_count: ${{ steps.classify.outputs.prose_count }}
      prose_files: ${{ steps.classify.outputs.prose_files }}
      editorconfig_count: ${{ steps.classify.outputs.editorconfig_count }}
      editorconfig_files: ${{ steps.classify.outputs.editorconfig_files }}

  eslint:
    name: 'ESLint - JavaScript/TypeScript Linter'
    needs: detect
    if: needs.detect.outputs.eslint_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Setup Node.js'
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: 'Install dependencies'
        run: |
          set -euo pipefail
          if [[ -f package.json ]] &&
            [[ -f package-lock.json || -f yarn.lock || -f pnpm-lock.yaml ]]
          then
            npm ci
          elif [[ -f package.json ]]; then
            npm install --no-save --ignore-scripts
          else
            echo 'No package.json found, skipping dependency installation'
          fi

      - name: 'Install ESLint'
        run: |
          set -euo pipefail
          npm install -g "eslint@${QC_ESLINT_VERSION}"

      - name: 'Run ESLint'
        env:
          QC_FILES: ${{ needs.detect.outputs.eslint_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to lint'
            exit 0
          fi
          if npx --no-install eslint --version >/dev/null 2>&1; then
            echo 'Using repo-local ESLint'
            npx --no-install eslint "${paths[@]}"
          else
            echo 'Using pinned global ESLint'
            eslint "${paths[@]}"
          fi

  prettier:
    name: 'Prettier - Code Formatter'
    needs: detect
    if: needs.detect.outputs.prettier_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Setup Node.js'
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: 'Install dependencies'
        run: |
          set -euo pipefail
          if [[ -f package.json ]] &&
            [[ -f package-lock.json || -f yarn.lock || -f pnpm-lock.yaml ]]
          then
            npm ci
          elif [[ -f package.json ]]; then
            npm install --no-save --ignore-scripts
          else
            echo 'No package.json found, skipping dependency installation'
          fi

      - name: 'Install Prettier'
        run: |
          set -euo pipefail
          npm install -g "prettier@${QC_PRETTIER_VERSION}"

      - name: 'Run Prettier'
        env:
          QC_FILES: ${{ needs.detect.outputs.prettier_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to check with Prettier'
            exit 0
          fi
          # Default ignore resolution: Prettier loads .prettierignore and
          # .gitignore from the file path upward (do not pass --ignore-path,
          # which replaces that default list and is easy to misconfigure).
          if npx --no-install prettier --version >/dev/null 2>&1; then
            echo 'Using repo-local Prettier'
            npx --no-install prettier --no-error-on-unmatched-pattern \
              --check "${paths[@]}"
          else
            echo 'Using pinned global Prettier'
            prettier --no-error-on-unmatched-pattern --check "${paths[@]}"
          fi

  markdownlint:
    name: 'Markdownlint - Markdown Linter'
    needs: detect
    if: needs.detect.outputs.markdownlint_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Setup Node.js'
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: 'Install dependencies'
        run: |
          set -euo pipefail
          if [[ -f package.json ]] &&
            [[ -f package-lock.json || -f yarn.lock || -f pnpm-lock.yaml ]]
          then
            npm ci
          elif [[ -f package.json ]]; then
            npm install --no-save --ignore-scripts
          else
            echo 'No package.json found, skipping dependency installation'
          fi

      - name: 'Install markdownlint-cli2'
        run: |
          set -euo pipefail
          npm install -g "markdownlint-cli2@${QC_MARKDOWNLINT_VERSION}"

      - name: 'Run markdownlint-cli2'
        env:
          QC_FILES: ${{ needs.detect.outputs.markdownlint_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to lint'
            exit 0
          fi
          if npx --no-install markdownlint-cli2 --version >/dev/null 2>&1; then
            echo 'Using repo-local markdownlint-cli2'
            npx --no-install markdownlint-cli2 "${paths[@]}"
          else
            echo 'Using pinned global markdownlint-cli2'
            markdownlint-cli2 "${paths[@]}"
          fi

  yamllint:
    name: 'Yamllint - YAML Linter'
    needs: detect
    if: needs.detect.outputs.yaml_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Install yamllint'
        run: |
          set -euo pipefail
          pip3 install "yamllint==${QC_YAMLLINT_VERSION}"

      - name: 'Run yamllint'
        env:
          QC_FILES: ${{ needs.detect.outputs.yaml_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to lint'
            exit 0
          fi
          yamllint "${paths[@]}"

  shellcheck:
    name: 'ShellCheck - Shell Script Linter'
    needs: detect
    if: needs.detect.outputs.shell_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Run ShellCheck'
        env:
          QC_FILES: ${{ needs.detect.outputs.shell_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to lint'
            exit 0
          fi
          shellcheck -x "${paths[@]}"

  shfmt:
    name: 'shfmt - Shell Formatter'
    needs: detect
    if: needs.detect.outputs.shell_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Install shfmt'
        run: |
          set -euo pipefail
          base_url="https://github.com/mvdan/sh/releases/download"
          file="shfmt_v${QC_SHFMT_VERSION}_linux_amd64"
          url="${base_url}/v${QC_SHFMT_VERSION}/${file}"
          curl -fsSL "$url" -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/

      - name: 'Run shfmt'
        env:
          QC_FILES: ${{ needs.detect.outputs.shell_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to check'
            exit 0
          fi
          shfmt -d "${paths[@]}"

  ruff:
    name: 'Ruff - Python Linter'
    needs: detect
    if: needs.detect.outputs.ruff_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Install Ruff'
        run: |
          set -euo pipefail
          pip3 install "ruff==${QC_RUFF_VERSION}"

      - name: 'Run Ruff'
        env:
          QC_FILES: ${{ needs.detect.outputs.ruff_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to lint'
            exit 0
          fi
          ruff check "${paths[@]}"

  taplo:
    name: 'Taplo - TOML Linter'
    needs: detect
    if: needs.detect.outputs.toml_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Install Taplo'
        run: |
          set -euo pipefail
          base_url="https://github.com/tamasfe/taplo/releases/download"
          url="${base_url}/${QC_TAPLO_VERSION}/taplo-linux-x86_64.gz"
          curl -fsSL "${url}" -o taplo.gz
          gunzip -f taplo.gz
          chmod +x taplo
          sudo mv taplo /usr/local/bin/

      - name: 'Run Taplo'
        env:
          QC_FILES: ${{ needs.detect.outputs.toml_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to lint'
            exit 0
          fi
          taplo lint "${paths[@]}"

  hadolint:
    name: 'Hadolint - Dockerfile Linter'
    needs: detect
    if: needs.detect.outputs.docker_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Install Hadolint'
        run: |
          set -euo pipefail
          base_url="https://github.com/hadolint/hadolint/releases/download"
          url="${base_url}/${QC_HADOLINT_VERSION}/hadolint-Linux-x86_64"
          curl -fsSL "${url}" -o hadolint
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      - name: 'Run Hadolint'
        env:
          QC_FILES: ${{ needs.detect.outputs.docker_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to lint'
            exit 0
          fi
          hadolint "${paths[@]}"

  jq:
    name: 'jq - JSON Validator'
    needs: detect
    if: needs.detect.outputs.jq_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Run jq'
        env:
          QC_FILES: ${{ needs.detect.outputs.jq_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            # jq empty accepts a root of false or null; jq -e . does not.
            jq empty "${file}" >/dev/null
          done < <(printf '%s\n' "${QC_FILES}")

  stylua:
    name: 'StyLua - Lua Formatter'
    needs: detect
    if: needs.detect.outputs.stylua_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Install StyLua'
        run: |
          set -euo pipefail
          base_url="https://github.com/JohnnyMorganz/StyLua/releases/download"
          url="${base_url}/${QC_STYLUA_VERSION}/stylua-linux-x86_64.zip"
          tmpdir="$(mktemp -d)"
          curl -fsSL "$url" -o "${tmpdir}/stylua.zip"
          unzip -q "${tmpdir}/stylua.zip" -d "${tmpdir}"
          sudo install -m 0755 "${tmpdir}/stylua" /usr/local/bin/stylua
          rm -rf "${tmpdir}"

      - name: 'Run StyLua'
        env:
          QC_FILES: ${{ needs.detect.outputs.stylua_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to check'
            exit 0
          fi
          stylua --check "${paths[@]}"

  typos:
    name: 'typos - Spell Checker'
    needs: detect
    if: needs.detect.outputs.prose_count != '0'
    runs-on: ubuntu-latest
    env:
      QC_SCRIPTS: ${{ github.workspace }}/.qc-tooling/.github/scripts

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      # Helpers live in this repository, not in the caller checkout.
      - name: 'Checkout quality-checks tooling'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qc-tooling
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: 'Install typos'
        run: |
          set -euo pipefail
          base_url="https://github.com/crate-ci/typos/releases/download"
          archive="typos-${QC_TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="${base_url}/${QC_TYPOS_VERSION}/${archive}"
          tmpdir="$(mktemp -d)"
          curl -fsSL "$url" -o "${tmpdir}/typos.tar.gz"
          # Archive members are ./typos (GNU tar rejects bare "typos").
          tar -xzf "${tmpdir}/typos.tar.gz" -C "${tmpdir}"
          sudo install -m 0755 "${tmpdir}/typos" /usr/local/bin/typos
          rm -rf "${tmpdir}"

      - name: 'Run typos'
        env:
          QC_FILES: ${{ needs.detect.outputs.prose_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to check'
            exit 0
          fi
          # shellcheck source=.github/scripts/qc-typos-args.sh
          source "${QC_SCRIPTS}/qc-typos-args.sh"
          if [[ ${#TYPOS_CLI_ARGS[@]} -gt 0 ]]; then
            echo "Using typos config: ${TYPOS_CLI_ARGS[1]}"
          else
            echo 'No typos.toml found; using built-in dictionary only'
          fi
          typos "${TYPOS_CLI_ARGS[@]}" "${paths[@]}"

  editorconfig:
    name: 'EditorConfig - Style Consistency'
    needs: detect
    if: needs.detect.outputs.editorconfig_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Install editorconfig-checker'
        run: |
          set -euo pipefail
          org="editorconfig-checker"
          base_url="https://github.com/${org}/${org}/releases/download"
          url="${base_url}/${QC_EC_VERSION}/ec-linux-amd64.tar.gz"
          curl -fsSL "$url" -o ec.tar.gz
          tar -xzf ec.tar.gz bin/ec-linux-amd64
          sudo mv bin/ec-linux-amd64 /usr/local/bin/ec
          rm -rf ec.tar.gz bin

      - name: 'Run editorconfig-checker'
        env:
          QC_FILES: ${{ needs.detect.outputs.editorconfig_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to check'
            exit 0
          fi
          ec "${paths[@]}"

  actionlint:
    name: 'actionlint - Workflow Linter'
    needs: detect
    if: needs.detect.outputs.actionlint_count != '0'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 'Install actionlint'
        run: |
          set -euo pipefail
          base_url="https://github.com/rhysd/actionlint/releases/download"
          archive="actionlint_${QC_ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          url="${base_url}/${QC_ACTIONLINT_VERSION}/${archive}"
          tmpdir="$(mktemp -d)"
          curl -fsSL "$url" -o "${tmpdir}/actionlint.tar.gz"
          tar -xzf "${tmpdir}/actionlint.tar.gz" -C "${tmpdir}" actionlint
          sudo install -m 0755 \
            "${tmpdir}/actionlint" /usr/local/bin/actionlint
          rm -rf "${tmpdir}"

      - name: 'Run actionlint'
        env:
          QC_FILES: ${{ needs.detect.outputs.actionlint_files }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=()
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done < <(printf '%s\n' "${QC_FILES}")
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to lint'
            exit 0
          fi
          # job.workflow_repository / workflow_sha identify the callee in
          # reusable workflows; actionlint supports them on main but not in
          # any release yet (rhysd/actionlint#757) — ignore until then.
          actionlint \
            -ignore 'property "workflow_(repository|sha)" is not defined' \
            "${paths[@]}"

  golangci-lint:
    name: 'golangci-lint - Go Linter'
    needs: detect
    if: needs.detect.outputs.go_count != '0'
    runs-on: ubuntu-latest
    env:
      QC_SCRIPTS: ${{ github.workspace }}/.qc-tooling/.github/scripts

    steps:
      - name: 'Checkout Code'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Helpers live in this repository, not in the caller checkout.
      - name: 'Checkout quality-checks tooling'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qc-tooling
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: 'Setup Go'
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 'stable'

      - name: 'Install golangci-lint'
        run: |
          set -euo pipefail
          base_url="https://github.com/golangci/golangci-lint/releases/download"
          tag="v${QC_GOLANGCI_LINT_VERSION}"
          version="${QC_GOLANGCI_LINT_VERSION}"
          archive="golangci-lint-${version}-linux-amd64.tar.gz"
          checksums="golangci-lint-${version}-checksums.txt"
          tmpdir="$(mktemp -d)"
          curl -fsSL -o "${tmpdir}/${archive}" \
            "${base_url}/${tag}/${archive}"
          curl -fsSL -o "${tmpdir}/${checksums}" \
            "${base_url}/${tag}/${checksums}"
          expected="$(
            grep " ${archive}\$" "${tmpdir}/${checksums}" | awk '{print $1}'
          )"
          echo "${expected}  ${tmpdir}/${archive}" | \
            sha256sum --check --strict -
          tar -xzf "${tmpdir}/${archive}" -C "${tmpdir}"
          extract_dir="golangci-lint-${version}-linux-amd64"
          sudo install -m 0755 \
            "${tmpdir}/${extract_dir}/golangci-lint" \
            /usr/local/bin/golangci-lint
          rm -rf "${tmpdir}"

      - name: 'Run golangci-lint'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # shellcheck source=.github/scripts/qc-resolve-base.sh
          source "${QC_SCRIPTS}/qc-resolve-base.sh"
          golangci-lint run --new-from-rev="${BASE_REF}" ./...

  summary:
    name: checks
    needs:
      - detect
      - eslint
      - prettier
      - markdownlint
      - yamllint
      - shellcheck
      - shfmt
      - ruff
      - taplo
      - hadolint
      - jq
      - stylua
      - typos
      - editorconfig
      - actionlint
      - golangci-lint
    # Required-check pattern: the aggregate always runs so the context is
    # reported even when tool jobs were skipped, and fails explicitly when
    # any needed job failed or the run was cancelled.
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: 'Fail on any failed or cancelled job'
        # yamllint disable-line rule:line-length
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo 'At least one applicable quality check failed or the' \
            'run was cancelled.' >&2
          exit 1

      - name: 'All applicable quality checks passed'
        run: |
          echo 'All applicable quality checks passed.'
