  shfmt:
    if: ${{ inputs.shfmt_run == true }}
    name: 'shfmt - Shell Formatter'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: 'Install shfmt'
        env:
          SHFMT_VERSION: 3.10.0
        run: |
          set -euo pipefail
          url="https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          curl -fsSL "$url" -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/

      - name: 'Get changed shell files'
        id: changed-files
        run: |
          set -euo pipefail
          source .github/scripts/qc-resolve-base.sh
          mapfile -t CHANGED_FILES < <(
            git diff --name-only --diff-filter=ACMR "${BASE_REF}"...HEAD |
              grep -E '\.(sh|bash|zsh)$' || true
          )
          if [[ ${#CHANGED_FILES[@]} -gt 0 ]] && \
            [[ -n "${CHANGED_FILES[0]}" ]]; then
            {
              printf 'files<<EOF\n'
              printf '%s\n' "${CHANGED_FILES[@]}"
              printf 'EOF\n'
              echo 'any_changed=true'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'any_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: 'Run shfmt'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ "${{ steps.changed-files.outputs.any_changed }}" != \
            "true" ]]; then
            echo 'No shell files to check'
            exit 0
          fi
          readarray -t raw < <(
            printf '%s\n' "${{ steps.changed-files.outputs.files }}"
          )
          paths=()
          for file in "${raw[@]}"; do
            [[ -z "${file}" ]] && continue
            [[ -f "${file}" ]] || continue
            paths+=( "${file}" )
          done
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo 'No existing paths to check'
            exit 0
          fi
          shfmt -d "${paths[@]}"

  golangci-lint:
    if: ${{ inputs.golangci_lint_run == true }}
    name: 'golangci-lint - Go Linter'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: 'Setup Go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: 'Install golangci-lint'
        env:
          GOLANGCI_LINT_VERSION: v2.1.6
        run: |
          set -euo pipefail
          install_url="https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh"
          curl -fsSL "${install_url}" | \
            sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 'Get changed Go files'
        id: changed-files
        run: |
          set -euo pipefail
          source .github/scripts/qc-resolve-base.sh
          mapfile -t CHANGED_FILES < <(
            git diff --name-only --diff-filter=ACMR "${BASE_REF}"...HEAD |
              grep -E '\.go$' || true
          )
          if [[ ${#CHANGED_FILES[@]} -gt 0 ]] && \
            [[ -n "${CHANGED_FILES[0]}" ]]; then
            echo 'any_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: 'Run golangci-lint'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          source .github/scripts/qc-resolve-base.sh
          if [[ "${{ steps.changed-files.outputs.any_changed }}" != \
            "true" ]]; then
            echo 'No Go files to check'
            exit 0
          fi
          golangci-lint run --new-from-rev="${BASE_REF}" ./...
